name: Python CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]

    steps:
    - name: Кодты алу
      uses: actions/checkout@v3
    
    - name: Python ${{ matrix.python-version }} орнату
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Тәуелділіктерді орнату
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Flake8 линтинг
      run: |
        flake8 app/ tests/ --max-line-length=100 --show-source
    
    - name: Тесттерді іске қосу
      run: |
        pytest tests/ -v --cov=app --cov-report=xml
    
    - name: Coverage есебі
      run: |
        coverage report
        coverage html
    
    - name: Coverage артефакттерді сақтау
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/
    
    - name: Coverage сын есігі
      run: |
        coverage report --fail-under=80

  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Кодты алу
      uses: actions/checkout@v3
    
    - name: Python орнату
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Bandit қауіпсіздік тесті
      run: |
        pip install bandit
        bandit -r app/ -f html -o security-report.html || true
    
    - name: Қауіпсіздік есебін сақтау
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: security-report.html

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - name: Кодты алу
      uses: actions/checkout@v3
    
    - name: Python орнату
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Тәуелділіктерді орнату
      run: |
        pip install -r requirements.txt
    
    - name: Бағдарламаны іске қосу тесті
      run: |
        python main.py
        python -c "from app.calculator import Calculator; c = Calculator(); print('✅ Бағдарлама дұрыс жұмыс істейді')"
    
    - name: Жобалық файлдарды тексеру
      run: |
        echo "=== Файлдарды тексеру ==="
        ls -la
        echo "app/ дерекжұты:"
        ls -la app/
        echo "tests/ дерекжұты:"
        ls -la tests/
